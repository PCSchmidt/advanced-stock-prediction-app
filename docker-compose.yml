# Local run only (Stages 3-6): build the image and run an OFFLINE smoke, the
# Stage 4 HTTP service, and (Phase 6) the local Prometheus + Grafana stack
# scraping it. All services use committed fixtures; the lazy yfinance fetch
# path is never imported, so no network access and no API keys are involved.
# Nothing is pushed to a registry and nothing is exposed publicly.
services:
  # Stage 4 HTTP service: FastAPI + uvicorn, offline on committed fixtures.
  # No ALLOW_LIVE_DATA set -> live yfinance path is disabled in the container.
  # Phase 6: the Prometheus + Grafana services below scrape this one; all
  # host ports are env-overridable (${VAR:-default}) so parallel sibling
  # stacks can shift them without editing this file.
  api:
    build: .
    image: stock-prediction:local
    command: ["uvicorn", "stock_prediction.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      STOCK_PREDICTION_FIXTURE_DIR: /app/tests/fixtures
      # Committed Stage 2 evaluation CSV for the EVALUATION-CONTEXT
      # stock_prediction_eval_* Prometheus gauges (copied into the image).
      STOCK_PREDICTION_EVAL_RESULTS: /app/experiments/results.csv

  # Phase 6 observability stack (local only, no cloud services, no external
  # monitoring): Prometheus scrapes the api service; Grafana loads the
  # datasource + dashboard from the committed provisioning files.
  prometheus:
    image: prom/prometheus:v2.53.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9093}:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/opt/grafana-dashboards:ro
      # Named volume: Grafana state (users, saved layout changes) persists
      # across `compose down` by intent -- the ONLY persisted state in this
      # stack. Prometheus is deliberately stateless (no volume; local demo
      # metrics are regenerated by traffic).
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3003}:3000"
    depends_on:
      - prometheus

  forecast-smoke:
    build: .
    image: stock-prediction:local
    command: ["python", "-m", "stock_prediction.cli", "--fixture", "tests/fixtures/sample_daily.csv", "--model", "both"]

  bundle-smoke:
    build: .
    image: stock-prediction:local
    command:
      - sh
      - -c
      - |
        python -m stock_prediction.bundle --fixture tests/fixtures/sample_daily.csv --out /tmp/bundle &&
        python -m stock_prediction.bundle --check /tmp/bundle

volumes:
  # Grafana state only (see comment on the grafana service). Never committed.
  grafana-data:
