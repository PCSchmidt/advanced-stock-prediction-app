[project]
name = "stock_prediction"
version = "0.1.0"
description = "Time-series stock forecasting with drift monitoring and retraining (portfolio app)."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
